name: read time sync

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */3 * * *"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sync:
    name: Sync
    runs-on: ubuntu-latest
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_PAGE: ${{ secrets.NOTION_PAGE }}
      WEREAD_API_KEY: ${{ secrets.WEREAD_API_KEY }}
      HEATMAP_BLOCK_ID: ${{ secrets.HEATMAP_BLOCK_ID }}
      BOOK_DATABASE_NAME: ${{ vars.BOOK_DATABASE_NAME }}
      AUTHOR_DATABASE_NAME: ${{ vars.AUTHOR_DATABASE_NAME }}
      CATEGORY_DATABASE_NAME: ${{ vars.CATEGORY_DATABASE_NAME }}
      BOOKMARK_DATABASE_NAME: ${{ vars.BOOKMARK_DATABASE_NAME }}
      REVIEW_DATABASE_NAME: ${{ vars.REVIEW_DATABASE_NAME }}
      CHAPTER_DATABASE_NAME: ${{ vars.CHAPTER_DATABASE_NAME }}
      YEAR_DATABASE_NAME: ${{ vars.YEAR_DATABASE_NAME }}
      WEEK_DATABASE_NAME: ${{ vars.WEEK_DATABASE_NAME }}
      MONTH_DATABASE_NAME: ${{ vars.MONTH_DATABASE_NAME }}
      DAY_DATABASE_NAME: ${{ vars.DAY_DATABASE_NAME }}
      REF: ${{ github.ref }}
      REPOSITORY: ${{ github.repository }}
      YEAR: ${{ vars.YEAR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # 关键：装本地 fork，不是 PyPI 上的 weread2notionpro 老版本
          # (PyPI 同名包是原作者 0.6.8，会覆盖我们的修改)
          pip install -e .
      - name: Remove folder
        run: rm -rf ./OUT_FOLDER
      - name: Set default year if not provided
        run: echo "YEAR=$(date +"%Y")" >> $GITHUB_ENV
        if: env.YEAR == ''
      - name: weread heatmap
        env:
          WEREAD_API_KEY: ${{ secrets.WEREAD_API_KEY }}
        run: |
          python scripts/build_heatmap.py
      - name: Rename weread.svg to a stable name
        run: |
          set -ex
          echo "--- before rename ---"
          ls -la OUT_FOLDER/ 2>&1 || echo "OUT_FOLDER missing"
          if [ ! -f OUT_FOLDER/weread.svg ]; then
            echo "ERROR: build_heatmap did not produce OUT_FOLDER/weread.svg"
            exit 1
          fi
          mv -f OUT_FOLDER/weread.svg OUT_FOLDER/weread-heatmap.svg
          echo "--- after rename ---"
          ls -la OUT_FOLDER/
      - name: push
        env:
          # push 步骤需要写权限（默认是 read-only，参考之前修的 workflow 权限）
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # 关键：必须先 commit 再 rebase。
          # git add 之后文件是 staged，rebase 拒绝 "Your index contains uncommitted changes"；
          # commit 之后 rebase 把它当本地 commit 处理，可以正常 rebase 到最新 remote 之上。
          for i in 1 2 3; do
            echo "=== attempt $i ==="
            # 用 -A 而不是只 add weread-heatmap.svg：
            #   OUT_FOLDER/ 里可能有遗留的 weread.svg（HEAD 还跟踪着但工作区已被 mv 删了），
            #   只 add 新文件的话这个 deletion 不会被 stage，rebase 会因为 'unstaged changes' 拒绝
            git add -A OUT_FOLDER/
            if git diff --cached --quiet; then
              echo "No diff — creating empty marker commit"
              git commit --allow-empty -m "chore: heatmap run $(date -u +'%Y-%m-%dT%H:%M:%SZ') (no data change)"
            else
              echo "--- diff ---"
              git diff --cached --stat
              git commit -m "update: heatmap $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            fi
            # rebase 一次把别人的新 commit 拿过来 + 立刻 push
            if git pull --rebase origin main && git push; then
              echo "pushed OK"
              exit 0
            fi
            echo "push failed, retrying in 2s"
            sleep 2
          done
          echo "ERROR: failed to push after 3 attempts"
          exit 1
      - name: read time sync
        run: |
          read_time
      - name: dedupe day pages
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        continue-on-error: true   # dedupe 是 best-effort；失败也不让整个 workflow 挂掉
        run: |
          python scripts/dedupe_day_pages.py
      - name: aggregate durations to year/month/week
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        if: always()              # 即使 dedupe 失败也跑 aggregate
        continue-on-error: true   # aggregate 也是 best-effort；「日」database 已有原数据，下次跑能修
        run: |
          python scripts/aggregate_durations.py
