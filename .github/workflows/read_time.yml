name: read time sync

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */3 * * *"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sync:
    name: Sync
    runs-on: ubuntu-latest
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_PAGE: ${{ secrets.NOTION_PAGE }}
      WEREAD_API_KEY: ${{ secrets.WEREAD_API_KEY }}
      HEATMAP_BLOCK_ID: ${{ secrets.HEATMAP_BLOCK_ID }}
      BOOK_DATABASE_NAME: ${{ vars.BOOK_DATABASE_NAME }}
      AUTHOR_DATABASE_NAME: ${{ vars.AUTHOR_DATABASE_NAME }}
      CATEGORY_DATABASE_NAME: ${{ vars.CATEGORY_DATABASE_NAME }}
      BOOKMARK_DATABASE_NAME: ${{ vars.BOOKMARK_DATABASE_NAME }}
      REVIEW_DATABASE_NAME: ${{ vars.REVIEW_DATABASE_NAME }}
      CHAPTER_DATABASE_NAME: ${{ vars.CHAPTER_DATABASE_NAME }}
      YEAR_DATABASE_NAME: ${{ vars.YEAR_DATABASE_NAME }}
      WEEK_DATABASE_NAME: ${{ vars.WEEK_DATABASE_NAME }}
      MONTH_DATABASE_NAME: ${{ vars.MONTH_DATABASE_NAME }}
      DAY_DATABASE_NAME: ${{ vars.DAY_DATABASE_NAME }}
      REF: ${{ github.ref }}
      REPOSITORY: ${{ github.repository }}
      YEAR: ${{ vars.YEAR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Remove folder
        run: rm -rf ./OUT_FOLDER
      - name: Set default year if not provided
        run: echo "YEAR=$(date +"%Y")" >> $GITHUB_ENV
        if: env.YEAR == ''
      - name: weread heatmap
        env:
          WEREAD_API_KEY: ${{ secrets.WEREAD_API_KEY }}
        run: |
          python scripts/build_heatmap.py
      - name: Rename weread.svg to a stable name
        run: |
          set -e
          ls -la OUT_FOLDER/
          # 用固定文件名（不依赖 uuidgen/python uuid，也方便 Notion embed 固定 URL）
          if [ ! -f OUT_FOLDER/weread.svg ]; then
            echo "ERROR: OUT_FOLDER/weread.svg was not generated by build_heatmap step"
            exit 1
          fi
          # 删掉旧版本（如果存在），避免 stale SVG 一直占着
          git rm -f --ignore-unmatch OUT_FOLDER/weread-heatmap.svg || true
          git rm -f --ignore-unmatch OUT_FOLDER/*.svg || true
          mv OUT_FOLDER/weread.svg OUT_FOLDER/weread-heatmap.svg
          ls -la OUT_FOLDER/
      - name: push
        run: |
          set -e
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # 用 -f 绕过 .gitignore（SVG 必须真的进 git 才能用 raw.githubusercontent.com 访问）
          git add -f OUT_FOLDER/weread-heatmap.svg
          # diff --cached 看实际会提交什么（诊断用）
          git diff --cached --stat
          git commit -m 'update: heatmap'
          # 显式 push（不要 || echo 把错误吞了）
          git push
      - name: read time sync
        run: |
          read_time
